services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_files:/files
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: product-listing-frontend
    ports:
      - "3002:3002"
    volumes:
      - ./n8n_files:/files
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/form-submit
      - UPLOAD_DIR=/files
    depends_on:
      - n8n
    networks:
      - app-network
    restart: unless-stopped

volumes:
  n8n_data:

networks:
  app-network:
    driver: bridge
